.lang-tabs button{border:1px solid var(--border);background:var(--sand);color:var(--sub);border-radius:999px;padding:9px 18px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
.lang-tabs button.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.phrase-list{display:grid;gap:10px;}
.phrase-item{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--sand);border-radius:12px;padding:14px 18px;align-items:center;}
.phrase-item .no{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:3px;}
.phrase-item .ja{font-size:14px;font-weight:700;}
.phrase-item .native{font-size:16px;font-weight:700;color:var(--teal);}
.phrase-item .reading{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:3px;}
.note{margin-top:20px;font-size:12px;color:var(--sub);line-height:1.8;}
@media (max-width:560px){
  .phrase-item{grid-template-columns:1fr;gap:4px;}
}

<main>
  <h1>旅行フレーズ集</h1>
  <p class="lead">国内旅行・海外旅行の現地でよく使う会話フレーズを、日本語と外国語（英語・中国語・スペイン語・ドイツ語・イタリア語・フランス語）で10例ずつまとめました。言語を選んで確認できます。</p>

  <div class="panel">
    <div class="lang-tabs" id="langTabs"></div>
    <div class="phrase-list" id="phraseList"></div>
  </div>

  <p class="note">※発音のカタカナ・ピンイン表記はあくまで目安です。実際の発音は現地の方の発音を参考にしてください。</p>
</main>

<footer style="border-top:1px solid var(--border);padding:24px 20px;text-align:center;font-size:12px;color:var(--sub);">

</footer>

<script>
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const JA_PHRASES=[
  'こんにちは',
  'ありがとうございます',
  'すみません（呼びかけ・謝罪）',
  'これはいくらですか？',
  '〜はどこですか？',
  'お願いします',
  '英語を話せますか？',
  'わかりません',
  'お会計をお願いします',
  'さようなら'
];

const LANGUAGES={
  en:{label:'🇬🇧 英語',phrases:[
    {native:'Hello / Hi',reading:'ハロー／ハイ'},
    {native:'Thank you',reading:'サンキュー'},
    {native:'Excuse me / Sorry',reading:'エクスキューズミー／ソーリー'},
    {native:'How much is this?',reading:'ハウ マッチ イズ ディス？'},
    {native:'Where is ~?',reading:'ウェア イズ〜？'},
    {native:'Please',reading:'プリーズ'},
    {native:'Do you speak English?',reading:'ドゥー ユー スピーク イングリッシュ？'},
    {native:"I don't understand",reading:'アイ ドント アンダースタンド'},
    {native:'Check, please',reading:'チェック、プリーズ'},
    {native:'Goodbye',reading:'グッバイ'}
  ]},
  zh:{label:'🇨🇳 中国語',phrases:[
    {native:'你好',reading:'ニーハオ（Nǐ hǎo）'},
    {native:'谢谢',reading:'シエシエ（Xièxiè）'},
    {native:'不好意思 / 对不起',reading:'ブーハオイース／ドゥイブチー（Bù hǎoyìsi / Duìbùqǐ）'},
    {native:'这个多少钱？',reading:'ジェイガ ドゥオシャオ チエン？（Zhège duōshao qián?）'},
    {native:'~在哪里？',reading:'〜ザイ ナーリー？（~zài nǎlǐ?）'},
    {native:'请 / 麻烦你',reading:'チン／マーファンニー（Qǐng / máfan nǐ）'},
    {native:'你会说英语吗？',reading:'ニー フイ シュオ インユー マ？（Nǐ huì shuō Yīngyǔ ma?）'},
    {native:'我不明白',reading:'ウォー ブー ミンバイ（Wǒ bù míngbái）'},
    {native:'买单，谢谢',reading:'マイダン、シエシエ（Mǎidān, xièxiè）'},
    {native:'再见',reading:'ザイジエン（Zàijiàn）'}
  ]},
  es:{label:'🇪🇸 スペイン語',phrases:[
    {native:'Hola',reading:'オラ'},
    {native:'Gracias',reading:'グラシアス'},
    {native:'Perdón / Disculpe',reading:'ペルドン／ディスクルペ'},
    {native:'¿Cuánto cuesta esto?',reading:'クアント クエスタ エスト？'},
    {native:'¿Dónde está ~?',reading:'ドンデ エスタ〜？'},
    {native:'Por favor',reading:'ポル ファボール'},
    {native:'¿Habla inglés?',reading:'アブラ イングレス？'},
    {native:'No entiendo',reading:'ノ エンティエンド'},
    {native:'La cuenta, por favor',reading:'ラ クエンタ、ポル ファボール'},
    {native:'Adiós',reading:'アディオス'}
  ]},
  de:{label:'🇩🇪 ドイツ語',phrases:[
    {native:'Hallo',reading:'ハロー'},
    {native:'Danke / Vielen Dank',reading:'ダンケ／フィーレン ダンク'},
    {native:'Entschuldigung',reading:'エントシュルディグング'},
    {native:'Wie viel kostet das?',reading:'ヴィー フィール コステット ダス？'},
    {native:'Wo ist ~?',reading:'ヴォー イスト〜？'},
    {native:'Bitte',reading:'ビッテ'},
    {native:'Sprechen Sie Englisch?',reading:'シュプレッヒェン ズィー エングリッシュ？'},
    {native:'Ich verstehe nicht',reading:'イッヒ フェアシュテーエ ニヒト'},
    {native:'Die Rechnung, bitte',reading:'ディー レヒヌング、ビッテ'},
    {native:'Auf Wiedersehen',reading:'アウフ ヴィーダーゼーエン'}
  ]},
  it:{label:'🇮🇹 イタリア語',phrases:[
    {native:'Ciao / Salve',reading:'チャオ／サルヴェ'},
    {native:'Grazie',reading:'グラッツィエ'},
    {native:'Mi scusi / Scusa',reading:'ミ スクージ／スクーザ'},
    {native:'Quanto costa questo?',reading:'クアント コスタ クエスト？'},
    {native:"Dov'è ~?",reading:'ドヴェ〜？'},
    {native:'Per favore',reading:'ペル ファヴォーレ'},
    {native:'Parla inglese?',reading:'パルラ イングレーゼ？'},
    {native:'Non capisco',reading:'ノン カピスコ'},
    {native:'Il conto, per favore',reading:'イル コント、ペル ファヴォーレ'},
    {native:'Arrivederci',reading:'アリヴェデルチ'}
  ]},
  fr:{label:'🇫🇷 フランス語',phrases:[
    {native:'Bonjour',reading:'ボンジュール'},
    {native:'Merci',reading:'メルシー'},
    {native:'Excusez-moi / Pardon',reading:'エクスキューゼ モワ／パルドン'},
    {native:'Combien ça coûte ?',reading:'コンビヤン サ クート？'},
    {native:'Où est ~ ?',reading:'ウー エ〜？'},
    {native:"S'il vous plaît",reading:'シル ヴ プレ'},
    {native:'Parlez-vous anglais ?',reading:'パルレ ヴー アングレ？'},
    {native:'Je ne comprends pas',reading:'ジュ ヌ コンプラン パ'},
    {native:"L'addition, s'il vous plaît",reading:'ラディシオン、シル ヴ プレ'},
    {native:'Au revoir',reading:'オ ルヴォワール'}
  ]}
};

let currentLang='en';

function renderTabs(){
  const tabs=document.getElementById('langTabs');
  tabs.innerHTML=Object.entries(LANGUAGES).map(([key,l])=>
    `<button type="button" data-lang="${key}" class="${key===currentLang?'active':''}">${l.label}</button>`
  ).join('');
  tabs.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{currentLang=btn.dataset.lang;renderTabs();renderPhrases();});
  });
}

function renderPhrases(){
  const list=document.getElementById('phraseList');
  const lang=LANGUAGES[currentLang];
  list.innerHTML=lang.phrases.map((p,i)=>`
    <div class="phrase-item">
      <div>
        <div class="no">${i+1}</div>
        <div class="ja">${escapeHtml(JA_PHRASES[i])}</div>
      </div>
      <div>
        <div class="native">${escapeHtml(p.native)}</div>
        <span class="reading">${escapeHtml(p.reading)}</span>
      </div>
    </div>
  `).join('');
}

renderTabs();
renderPhrases();
</script>
</body>
</html>
