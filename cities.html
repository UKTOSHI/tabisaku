<style>
:root{--teal:#0f766e;--sky:#0284c7;--sand:#f5f1e8;--ink:#1f2937;--sub:#6b7280;--border:#e5e7eb;--card-bg:#ffffff;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--sand);}
a{color:inherit;text-decoration:none;}
header.site{background:linear-gradient(120deg,var(--teal),var(--sky));color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.site-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{font-size:20px;font-weight:900;}
nav.site a{margin-left:16px;font-weight:500;font-size:14px;opacity:.95;}
nav.site a.active{text-decoration:underline;}
main{max-width:1080px;margin:0 auto;padding:24px 20px 56px;}
h1{font-size:24px;margin:0 0 4px;}
.lead{color:var(--sub);font-size:13.5px;margin:0 0 20px;}
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;}
.row:last-child{margin-bottom:0;}
input[type=text], select{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;}
input[type=text]{flex:1;min-width:200px;}
.toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.toggle button{border:none;background:#fff;padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;}
.toggle button.active{background:var(--teal);color:#fff;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tag-chip{border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;background:#fff;user-select:none;}
.tag-chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.count{font-size:13px;color:var(--sub);margin-bottom:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.item{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .15s, transform .15s;}
.item:hover{box-shadow:0 8px 20px rgba(15,118,110,.15);transform:translateY(-2px);}
.item .badge{display:inline-block;font-size:11px;background:var(--sky);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:8px;}
.item h3{margin:0 0 6px;font-size:17px;}
.item p{margin:0 0 10px;font-size:12.5px;color:var(--sub);line-height:1.6;}
.ratings-mini{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--sub);border-top:1px solid var(--border);padding-top:9px;}
.ratings-mini .stars{color:#d97706;letter-spacing:1px;}
.empty{color:var(--sub);font-size:13.5px;padding:40px 0;text-align:center;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:0;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:0;max-width:100%;width:100%;height:100%;max-height:100vh;overflow-y:auto;padding:28px 20px 48px;position:relative;}
.modal .close{position:absolute;top:14px;right:16px;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--sub);z-index:1;}
@media (min-width:720px){
  .modal-bg{padding:24px;}
  .modal{border-radius:16px;max-width:680px;height:auto;max-height:92vh;padding:32px;}
}
.modal h2{margin:0 0 6px;font-size:26px;font-weight:900;line-height:1.3;}
.modal .sub{display:inline-block;color:var(--teal);background:#ecfdf5;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:4px;}
.modal .overview{font-size:15.5px;line-height:1.9;margin:18px 0 0;color:var(--ink);padding:14px 16px;background:var(--sand);border-radius:12px;}
.msection{border-radius:14px;padding:16px 18px;margin-top:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.msection h4{margin:0 0 10px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
.msection p{margin:0;font-size:14px;line-height:1.85;white-space:pre-line;}
.msection.spots{background:#ecfdf5;border-left:5px solid #059669;}
.msection.spots h4{color:#047857;}
.msection.food{background:#fff7ed;border-left:5px solid #ea580c;}
.msection.food h4{color:#c2410c;}
.msection.price{background:#eff6ff;border-left:5px solid #2563eb;}
.msection.price h4{color:#1d4ed8;}
.msection.ratings{background:#fffbeb;border-left:5px solid #d97706;}
.msection.ratings h4{color:#b45309;}
.ratings-table{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:8px;align-items:center;}
.ratings-table .rlabel{font-size:13.5px;color:var(--sub);white-space:nowrap;}
.ratings-table .rstars{font-size:17px;color:#d97706;letter-spacing:2px;}
.msection ul.mlist{margin:0;padding:0;list-style:none;}
.msection ul.mlist li{padding:8px 0;font-size:14px;line-height:1.7;border-top:1px solid rgba(0,0,0,.07);}
.msection ul.mlist li:first-child{border-top:none;padding-top:0;}
.msection ruby{ruby-position:over;}
.msection rt{font-size:10px;color:var(--sub);font-weight:500;user-select:none;}
.price-asof{display:inline-block;font-size:10.5px;font-weight:700;background:#2563eb;color:#fff;border-radius:999px;padding:3px 10px;}
.exchange-note{margin:0 0 12px;font-size:12.5px;color:var(--sub);}
.ptable{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);column-gap:8px;width:100%;}
.ptable .prow{display:contents;}
.ptable .prow>div{padding:9px 0;font-size:13.5px;border-top:1px solid rgba(0,0,0,.08);align-self:center;}
.ptable .prow:first-child>div{border-top:none;padding-top:0;}
.ptable .plabel{color:var(--sub);}
.ptable .pval-jpy{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
.ptable .pval-local{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px;}
.ptable .pval-jpy.full{grid-column:2/span 2;}
.tip-note{margin:14px 0 0;padding-top:12px;border-top:1px dashed rgba(0,0,0,.15);font-size:12.5px;color:var(--sub);line-height:1.7;}
.info-group{margin-top:22px;}
.info-group h4{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.03em;}
.infogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.infogrid .icell{background:var(--sand);border-radius:12px;padding:11px 14px;}
.infogrid .icell .k{font-size:11px;color:var(--sub);margin-bottom:3px;display:flex;align-items:center;gap:4px;}
.infogrid .icell .v{font-size:14px;line-height:1.6;font-weight:500;}
.modal .linkrow{margin-top:20px;font-size:14px;}
.modal .linkrow a{color:var(--teal);font-weight:700;}
.modal .mtags{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px;}
.modal .mtags span{background:var(--sand);border-radius:999px;padding:4px 12px;font-size:12px;}
.badge.reg-北米{background:#2563eb;}
.badge.reg-南米{background:#dc2626;}
.badge.reg-アジア{background:#ea580c;}
.badge.reg-ヨーロッパ{background:#7c3aed;}
.badge.reg-domestic{background:var(--teal);}
</style>
</head>

<main>
  <h1>国内旅行・海外旅行の都市を探す</h1>
  <p class="lead">国内旅行で人気の都市から、海外旅行の定番都市まで検索できます。ベストシーズン・通貨・言語・ビザ情報・物価の目安などを掲載。</p>

  <div class="panel">
    <div class="row">
      <input type="text" id="q" placeholder="都市名で検索（例：上海、京都）">
      <div class="toggle" id="domesticToggle">
        <button data-val="all" class="active">すべて</button>
        <button data-val="domestic">国内</button>
        <button data-val="intl">海外</button>
      </div>
    </div>
    <div class="row">
      <select id="prefSelect"><option value="">都道府県（国内のみ）</option></select>
      <select id="countrySelect"><option value="">国（海外のみ）</option></select>
      <select id="citySelect"><option value="">都市を選択</option></select>
    </div>
    <div class="row">
      <div class="tags" id="tagFilters"></div>
    </div>
  </div>
  <div class="count" id="countryFilterNotice" style="display:none;"></div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://sunxpjbdvidftukiutxg.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1bnhwamJkdmlkZnR1a2l1dHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NTU1MDUsImV4cCI6MjA5MDEzMTUwNX0.L9RU4U3kWy4CJzyVR4FEKUrDX8fD2jzWAbQxyaDOIsU';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

let cities=[], tags=[], cityTagMap={}, prefs=[];
let state={q:'',domestic:'all',pref:'',country:'',tagIds:new Set()};

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderStars(n){n=Number(n)||0;return '★'.repeat(n)+'☆'.repeat(Math.max(0,5-n));}

async function load(){
  const [{data:cityRows},{data:tagRows},{data:ctRows},{data:prefRows}]=await Promise.all([
    db.from('ts_cities').select('*, ts_prefectures(name)').eq('status',true).order('name_kana'),
    db.from('ts_tags').select('*').eq('content_type','city').order('sort_order'),
    db.from('ts_city_tags').select('city_id, tag_id'),
    db.from('ts_prefectures').select('id,name').order('sort_order')
  ]);
  cities=cityRows||[];
  tags=tagRows||[];
  prefs=prefRows||[];
  cityTagMap={};
  (ctRows||[]).forEach(r=>{(cityTagMap[r.city_id]=cityTagMap[r.city_id]||[]).push(r.tag_id);});

  document.getElementById('prefSelect').innerHTML='<option value="">都道府県（国内のみ）</option>'+
    prefs.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');

  populateCountrySelect();

  document.getElementById('tagFilters').innerHTML=tags.map(t=>
    `<div class="tag-chip" data-id="${t.id}">${escapeHtml(t.name)}</div>`
  ).join('');
  document.querySelectorAll('.tag-chip').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=Number(el.dataset.id);
      if(state.tagIds.has(id)){state.tagIds.delete(id);el.classList.remove('active');}
      else{state.tagIds.add(id);el.classList.add('active');}
      render();
    });
  });

  applyUrlParams();
  render();
}

const REGION_ORDER=['北米','南米','アジア','ヨーロッパ'];

function populateCountrySelect(){
  const byRegion=new Map();
  cities.filter(c=>!c.is_domestic).forEach(c=>{
    const region=c.region||'その他';
    if(!byRegion.has(region))byRegion.set(region,new Set());
    byRegion.get(region).add(c.country);
  });
  const regionKeys=[...byRegion.keys()].sort((a,b)=>{
    const ia=REGION_ORDER.indexOf(a), ib=REGION_ORDER.indexOf(b);
    return (ia<0?999:ia)-(ib<0?999:ib);
  });
  document.getElementById('countrySelect').innerHTML='<option value="">国（海外のみ）</option>'+
    regionKeys.map(region=>`<optgroup label="${escapeHtml(region)}">${
      [...byRegion.get(region)].sort().map(country=>`<option value="${escapeHtml(country)}">${escapeHtml(country)}</option>`).join('')
    }</optgroup>`).join('');
}

function populateCitySelect(list){
  const sel=document.getElementById('citySelect');
  const current=sel.value;
  sel.innerHTML='<option value="">都市を選択</option>'+
    [...list].sort((a,b)=>(a.name_kana||a.name).localeCompare(b.name_kana||b.name,'ja')).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if([...sel.options].some(o=>o.value===current))sel.value=current;
}

function applyUrlParams(){
  const params=new URLSearchParams(location.search);
  const domestic=params.get('domestic');
  if(domestic==='1'){
    state.domestic='domestic';
    document.querySelectorAll('#domesticToggle button').forEach(b=>b.classList.toggle('active',b.dataset.val==='domestic'));
  }else if(domestic==='0'){
    state.domestic='intl';
    document.querySelectorAll('#domesticToggle button').forEach(b=>b.classList.toggle('active',b.dataset.val==='intl'));
  }
  const country=params.get('country');
  if(country){
    state.country=country;
    state.domestic='intl';
    document.querySelectorAll('#domesticToggle button').forEach(b=>b.classList.toggle('active',b.dataset.val==='intl'));
    document.getElementById('countrySelect').value=country;
    const notice=document.getElementById('countryFilterNotice');
    notice.style.display='block';
    notice.innerHTML=`「${escapeHtml(country)}」の都市に絞り込み中 <a href="cities.html" style="color:var(--teal);font-weight:700;">（解除）</a>`;
  }
  const q=params.get('q');
  if(q){state.q=q;document.getElementById('q').value=q;}
}

function render(){
  const q=state.q.trim().toLowerCase();
  const baseList=cities.filter(c=>{
    if(state.domestic==='domestic'&&!c.is_domestic)return false;
    if(state.domestic==='intl'&&c.is_domestic)return false;
    if(state.pref&&String(c.prefecture_id)!==state.pref)return false;
    if(state.country&&c.country!==state.country)return false;
    if(state.tagIds.size){
      const t=cityTagMap[c.id]||[];
      if(![...state.tagIds].every(id=>t.includes(id)))return false;
    }
    return true;
  });
  populateCitySelect(baseList);

  let list=baseList.filter(c=>
    !q||[c.name,c.name_kana,c.name_en].some(v=>(v||'').toLowerCase().includes(q))
  );

  document.getElementById('count').textContent=`${list.length}件の都市`;
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="empty">条件に一致する都市が見つかりませんでした。</div>';return;}
  grid.innerHTML=list.map(c=>`
    <div class="item" data-id="${c.id}">
      <span class="badge reg-${c.is_domestic?'domestic':escapeHtml(c.region||'')}">${c.is_domestic?(c.ts_prefectures?c.ts_prefectures.name:'国内'):c.country}</span>
      <h3>${escapeHtml(c.name)}</h3>
      <p>${escapeHtml((c.description||'').slice(0,50))}${(c.description||'').length>50?'…':''}</p>
      ${c.popularity_rating||c.affordability_rating||c.safety_rating?`<div class="ratings-mini">
        <span>人気 <span class="stars">${renderStars(c.popularity_rating)}</span></span>
        <span>物価 <span class="stars">${renderStars(c.affordability_rating)}</span></span>
        <span>治安 <span class="stars">${renderStars(c.safety_rating)}</span></span>
      </div>`:''}
    </div>
  `).join('');
  grid.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click',()=>openModal(Number(el.dataset.id)));
  });
}

function splitSpotsInfo(text){
  return text.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(s=>s.trim()).filter(Boolean);
}

function openModal(id){
  const c=cities.find(x=>x.id===id);
  if(!c)return;
  const t=(cityTagMap[c.id]||[]).map(tid=>tags.find(x=>x.id===tid)).filter(Boolean);
  const infoGroups=[
    ['✈️ 旅のプランニング',[
      ['✈️','東京からのフライト時間',c.flight_time_from_tokyo],
      ['🕐','日本との時差',c.time_diff],
      ['☀️','ベストシーズン',c.best_season],
      ['🌐','タイムゾーン',c.timezone]
    ]],
    ['📋 実用情報',[
      ['💴','通貨',c.currency],
      ['🗣️','言語',c.language],
      ['📋','ビザ情報',c.visa_notes],
      ['🚗','アクセス',c.access_info]
    ]]
  ].map(([title,items])=>[title,items.filter(([,,v])=>v)]).filter(([,items])=>items.length);
  document.getElementById('modalBody').innerHTML=`
    <h2>${escapeHtml(c.name)}</h2>
    <div class="sub">${escapeHtml(c.is_domestic?(c.ts_prefectures?c.ts_prefectures.name+'・日本':'日本'):c.country)}</div>
    ${c.description?`<p class="overview">${escapeHtml(c.description)}</p>`:''}

    ${c.popularity_rating||c.affordability_rating||c.safety_rating?`<div class="msection ratings"><h4>⭐ 評価の目安</h4><div class="ratings-table">
      ${c.popularity_rating?`<div class="rlabel">日本人からの人気</div><div class="rstars">${renderStars(c.popularity_rating)}</div>`:''}
      ${c.affordability_rating?`<div class="rlabel">物価の安さ</div><div class="rstars">${renderStars(c.affordability_rating)}</div>`:''}
      ${c.safety_rating?`<div class="rlabel">治安の良さ</div><div class="rstars">${renderStars(c.safety_rating)}</div>`:''}
    </div></div>`:''}

    ${c.spots_info?`<div class="msection spots"><h4>📍 観光スポット</h4><ul class="mlist">${splitSpotsInfo(c.spots_info).map(v=>`<li>${v}</li>`).join('')}</ul></div>`:''}
    ${c.food_info?`<div class="msection food"><h4>🍴 おすすめグルメ</h4><p>${escapeHtml(c.food_info)}</p></div>`:''}
    ${c.price_hotel_jpy||c.price_meal_jpy||c.price_transport_jpy?`<div class="msection price"><h4>💰 物価の目安 <span class="price-asof">2026年9月時点</span></h4>
    ${c.exchange_rate_note?`<p class="exchange-note">💱 為替の目安：${escapeHtml(c.exchange_rate_note)}</p>`:''}
    <div class="ptable">
      ${c.price_hotel_jpy?`<div class="prow"><div class="plabel">ホテル1泊</div><div class="pval-jpy${c.price_hotel_local?'':' full'}">${escapeHtml(c.price_hotel_jpy)}</div>${c.price_hotel_local?`<div class="pval-local">${escapeHtml(c.price_hotel_local)}</div>`:''}</div>`:''}
      ${c.price_meal_jpy?`<div class="prow"><div class="plabel">食事1食</div><div class="pval-jpy${c.price_meal_local?'':' full'}">${escapeHtml(c.price_meal_jpy)}</div>${c.price_meal_local?`<div class="pval-local">${escapeHtml(c.price_meal_local)}</div>`:''}</div>`:''}
      ${c.price_transport_jpy?`<div class="prow"><div class="plabel">${escapeHtml(c.price_transport_label||'交通')}</div><div class="pval-jpy${c.price_transport_local?'':' full'}">${escapeHtml(c.price_transport_jpy)}</div>${c.price_transport_local?`<div class="pval-local">${escapeHtml(c.price_transport_local)}</div>`:''}</div>`:''}
    </div>${c.tip_info?`<p class="tip-note">💡 チップ：${escapeHtml(c.tip_info)}</p>`:''}</div>`:''}

    ${infoGroups.map(([title,items])=>`
      <div class="info-group">
        <h4>${title}</h4>
        <div class="infogrid">${items.map(([icon,k,v])=>`<div class="icell"><div class="k">${icon} ${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`).join('')}</div>
      </div>
    `).join('')}
    ${c.website_url?`<div class="linkrow"><a href="${escapeHtml(c.website_url)}" target="_blank" rel="noopener">関連リンクを見る →</a></div>`:''}
    ${t.length?`<div class="mtags">${t.map(x=>`<span>${escapeHtml(x.name)}</span>`).join('')}</div>`:''}
  `;
  document.getElementById('modalBg').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')e.currentTarget.classList.remove('open');});

document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});
document.getElementById('prefSelect').addEventListener('change',e=>{state.pref=e.target.value;render();});
document.getElementById('countrySelect').addEventListener('change',e=>{
  state.country=e.target.value;
  document.getElementById('countryFilterNotice').style.display='none';
  render();
});
document.getElementById('citySelect').addEventListener('change',e=>{
  if(!e.target.value)return;
  openModal(Number(e.target.value));
});
document.querySelectorAll('#domesticToggle button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#domesticToggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.domestic=btn.dataset.val;
    render();
  });
});

load();
</script>
</body>
</html>
